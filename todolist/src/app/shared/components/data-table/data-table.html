<section class="data-table-card">
  @if (loading()) {
    <div class="state-message">Carregando registros…</div>
  } @else if (data().length === 0) {
    <div class="state-message">
      <mat-icon>{{ ICONS.SEARCH_OFF }}</mat-icon>
      <strong>{{ emptyMessage() }}</strong></div>
  } @else {
    <div class="table-scroll">
      <table mat-table [dataSource]="data()">
        @for (column of columns(); track column.key) {
          <ng-container [matColumnDef]="column.key">
            <th mat-header-cell *matHeaderCellDef [class.cell-end]="column.align === 'end'">{{ column.label }}</th>
            <td mat-cell *matCellDef="let row" [class.cell-end]="column.align === 'end'">
              @if (column.template) {
                <ng-container [ngTemplateOutlet]="column.template" [ngTemplateOutletContext]="{ $implicit: row }"/>
              } @else {
                {{ row[column.key] }}
              }
            </td>
          </ng-container>
        }
        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
      </table>
    </div>
    <mat-paginator
      [length]="totalElements()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [hidePageSize]="true"
      (page)="changePage($event)"
      aria-label="Paginação"/>
  }
</section>
