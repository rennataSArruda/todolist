<div class="dialog-icon" aria-hidden="true"><mat-icon>logout</mat-icon></div>
<h2 mat-dialog-title>Sair da conta?</h2>
<mat-dialog-content>Sua sessão atual será encerrada. Para acessar novamente, será necessário fazer login.</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()">Sair</button>
</mat-dialog-actions>
