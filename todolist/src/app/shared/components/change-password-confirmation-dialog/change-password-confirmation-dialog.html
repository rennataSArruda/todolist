<div class="dialog-icon" aria-hidden="true"><mat-icon>lock_reset</mat-icon></div>
<h2 mat-dialog-title>Atualizar senha?</h2>
<mat-dialog-content>
  Todas as sessões ativas serão encerradas, inclusive esta. Após a atualização, será necessário entrar novamente.
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()">Atualizar senha</button>
</mat-dialog-actions>
