<div class="app-form-field" [class.app-form-field--invalid]="hasError">
  @if (label) {
    <label class="app-form-field__label" [for]="fieldId">
      {{ label }}
      @if (required) {
        <span class="app-form-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="app-form-field__control">
    @if (prefixIcon) {
      <mat-icon class="app-form-field__icon" aria-hidden="true">{{ prefixIcon }}</mat-icon>
    }

    <input
      class="app-form-field__input"
      [id]="fieldId"
      [type]="type"
      [value]="value ?? ''"
      [placeholder]="placeholder"
      [attr.aria-label]="ariaLabel || label || placeholder"
      [attr.aria-describedby]="describedById"
      [attr.aria-invalid]="hasError"
      [attr.maxlength]="maxlength"
      [attr.min]="min"
      [attr.max]="max"
      [autocomplete]="autocomplete"
      [disabled]="disabled"
      [readOnly]="readonly"
      [required]="required"
      (input)="handleInput($event)"
      (blur)="markAsTouched()"
    />

    @if (suffixIcon) {
      <mat-icon class="app-form-field__icon" aria-hidden="true">{{ suffixIcon }}</mat-icon>
    }
  </div>

  @if (hasError && errorMessage) {
    <p class="app-form-field__error" [id]="errorId">{{ errorMessage }}</p>
  } @else if (hint) {
    <p class="app-form-field__hint" [id]="hintId">{{ hint }}</p>
  }
</div>
