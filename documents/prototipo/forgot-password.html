<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focusly | Esqueci minha senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js" defer></script>
  <script src="auth-recovery.js" defer></script>
</head>
<body>
  <button class="theme-toggle public-theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
    <span data-theme-icon>☾</span>
  </button>

  <main class="auth-public-page">
    <div class="auth-public-shell">
      <div class="auth-public-brand">
        <a href="login.html">
          <span class="brand-mark">F</span>
          <span>Focusly</span>
        </a>
      </div>

      <section class="auth-card">
        <div class="auth-card-icon">↺</div>
        <h1>Esqueci minha senha</h1>
        <p>Informe seu username ou email. Se os dados estiverem corretos, enviaremos as instruções para redefinir sua senha.</p>

        <form id="forgotPasswordForm" novalidate>
          <div class="field">
            <label for="identifier">Username ou email</label>
            <input
              class="form-control"
              id="identifier"
              name="identifier"
              autocomplete="username"
              placeholder="usuario@email.com"
              required>
          </div>

          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">Enviar instruções</button>
          </div>
        </form>

        <div id="forgotPasswordMessage" class="auth-message" role="status" aria-live="polite"></div>

        <div class="soft-box" style="margin-top:18px;font-size:.76rem;color:var(--muted)">
          <strong style="display:block;margin-bottom:5px;color:var(--text)">Atalho do protótipo</strong>
          Para visualizar a próxima etapa sem um email real,
          <a href="reset-password.html?token=abc123" style="color:var(--primary-dark);font-weight:800">
            simule o link recebido por email
          </a>.
        </div>

        <a class="auth-back" href="login.html">← Voltar para o login</a>
      </section>
    </div>
  </main>
</body>
</html>
