<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focusly | Redefinir senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js" defer></script>
  <script src="auth-recovery.js" defer></script>
</head>
<body>
  <button class="theme-toggle public-theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
    <span data-theme-icon>☾</span>
  </button>

  <main class="auth-public-page">
    <div class="auth-public-shell">
      <div class="auth-public-brand">
        <a href="login.html">
          <span class="brand-mark">F</span>
          <span>Focusly</span>
        </a>
      </div>

      <section class="auth-card">
        <div class="auth-card-icon">✦</div>
        <h1>Redefinir senha</h1>
        <p>Crie uma nova senha para sua conta. O token recebido no link é preservado internamente e não aparece na tela.</p>

        <div id="resetTokenMessage" class="auth-message" role="alert" aria-live="assertive"></div>

        <form id="resetPasswordForm" novalidate>
          <div class="field password-field">
            <label for="newPassword">Nova senha</label>
            <input
              class="form-control"
              id="newPassword"
              name="newPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Mínimo de 8 caracteres"
              required>
            <button class="password-toggle" type="button" data-password-toggle="newPassword" aria-label="Mostrar ou ocultar nova senha">◉</button>
          </div>

          <div class="field password-field" style="margin-top:16px">
            <label for="confirmPassword">Confirmar nova senha</label>
            <input
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Repita a nova senha"
              required>
            <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Mostrar ou ocultar confirmação">◉</button>
          </div>

          <ul class="password-rules" aria-label="Regras da senha">
            <li id="ruleLength">Pelo menos 8 caracteres</li>
            <li id="ruleMatch">As senhas precisam ser iguais</li>
          </ul>

          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">Redefinir senha</button>
          </div>
        </form>

        <div id="resetPasswordMessage" class="auth-message" role="status" aria-live="polite"></div>

        <a class="auth-back" href="forgot-password.html">Solicitar novo link de recuperação</a>
      </section>
    </div>
  </main>
</body>
</html>
